<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — ConnectMail</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080c12;--bg2:#0d1420;--surface:#131e2e;--surface2:#1a2840;--border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);--accent:#3b82f6;--accent-h:#2563eb;--green:#22c55e;--red:#ef4444;--text:#e8edf5;--text2:#8b99b5;--text3:#5a6880;--radius:10px;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 70% 80%,rgba(59,130,246,0.07) 0%,transparent 60%);pointer-events:none}
.card{width:100%;max-width:420px;background:var(--surface);border:0.5px solid var(--border2);border-radius:20px;padding:40px;animation:fadeUp .6s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:28px;text-decoration:none}
.logo-icon{width:36px;height:36px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Syne',sans-serif;font-weight:800;font-size:18px;color:#fff;box-shadow:0 0 20px rgba(59,130,246,0.35)}
.logo-name{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;color:var(--text)}
h1{font-family:'Syne',sans-serif;font-size:26px;font-weight:800;margin-bottom:6px}
.subtitle{font-size:14px;color:var(--text2);margin-bottom:28px}
.subtitle a{color:var(--accent);text-decoration:none}
.field{margin-bottom:16px}
label{display:block;font-size:13px;font-weight:500;color:var(--text2);margin-bottom:6px}
.label-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.label-row a{font-size:12px;color:var(--accent);text-decoration:none}
.label-row a:hover{text-decoration:underline}
.input-wrap{position:relative}
input[type=email],input[type=password]{width:100%;padding:11px 44px 11px 14px;background:var(--bg2);border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--text);font-family:'DM Sans',sans-serif;font-size:14px;transition:border-color .2s,box-shadow .2s;outline:none}
input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,0.12)}
input.error{border-color:var(--red)}
.password-toggle{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px}
.field-error{font-size:12px;color:var(--red);margin-top:5px;display:none}
.field-error.show{display:block}
.remember{display:flex;align-items:center;gap:8px;margin-bottom:20px}
.remember input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent)}
.remember label{font-size:13px;color:var(--text2);margin:0;cursor:pointer}
.btn{width:100%;padding:13px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius);font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s}
.btn:hover{background:var(--accent-h);transform:translateY(-1px);box-shadow:0 8px 24px rgba(59,130,246,0.35)}
.btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.btn-loader{display:none;width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.divider{display:flex;align-items:center;gap:12px;margin:20px 0;color:var(--text3);font-size:13px}
.divider::before,.divider::after{content:'';flex:1;height:0.5px;background:var(--border)}
.btn-oauth{width:100%;padding:12px;background:transparent;border:0.5px solid var(--border2);border-radius:var(--radius);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-oauth:hover{background:var(--surface2);color:var(--text)}
.alert{padding:12px 16px;border-radius:var(--radius);font-size:14px;margin-bottom:16px;display:none}
.alert.success{background:rgba(34,197,94,0.1);border:0.5px solid rgba(34,197,94,0.3);color:var(--green)}
.alert.error{background:rgba(239,68,68,0.1);border:0.5px solid rgba(239,68,68,0.3);color:var(--red)}
.alert.show{display:block}
</style>
</head>
<body>
<div class="card">
  <a href="/" class="logo">
    <div class="logo-icon">C</div>
    <div class="logo-name">ConnectMail</div>
  </a>
  <h1>Bon retour 👋</h1>
  <p class="subtitle">Pas encore de compte ? <a href="/register">Créer un compte</a></p>

  <div class="alert" id="alert"></div>

  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Adresse email</label>
      <input type="email" id="email" name="email" placeholder="vous@exemple.com" autocomplete="email">
      <div class="field-error" id="emailErr"></div>
    </div>

    <div class="field">
      <div class="label-row">
        <label for="password">Mot de passe</label>
        <a href="forgot-password.html">Mot de passe oublié ?</a>
      </div>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password">
        <button type="button" class="password-toggle" onclick="togglePwd()">👁</button>
      </div>
      <div class="field-error" id="passwordErr"></div>
    </div>

    <div class="remember">
      <input type="checkbox" id="rememberMe" name="rememberMe">
      <label for="rememberMe">Se souvenir de moi (30 jours)</label>
    </div>

    <button type="submit" class="btn" id="submitBtn">
      <span id="btnText">Se connecter</span>
      <div class="btn-loader" id="btnLoader"></div>
    </button>

    <div class="divider">ou</div>
    <button type="button" class="btn-oauth" onclick="window.location.href='/api/auth/oauth/google'">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuer avec Google
    </button>
  </form>
</div>

<script>
const API = '/api/auth';

// Message si vient de l'inscription
const params = new URLSearchParams(location.search);
if (params.get('registered')) showAlert('Compte créé ! Vérifiez votre email pour activer votre compte.', 'success');
if (params.get('verified'))   showAlert('Email vérifié ! Vous pouvez maintenant vous connecter.', 'success');

function togglePwd() {
  const input = document.getElementById('password');
  input.type = input.type === 'password' ? 'text' : 'password';
}

function showError(fieldId, msg) {
  const el = document.getElementById(fieldId + 'Err');
  if (el) { el.textContent = msg; el.classList.add('show'); }
  const input = document.getElementById(fieldId);
  if (input) input.classList.add('error');
}

function clearErrors() {
  document.querySelectorAll('.field-error').forEach(el => { el.textContent = ''; el.classList.remove('show'); });
  document.querySelectorAll('input').forEach(el => el.classList.remove('error'));
}

function showAlert(msg, type) {
  const el = document.getElementById('alert');
  el.textContent = msg;
  el.className = `alert ${type} show`;
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  clearErrors();

  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const rememberMe = document.getElementById('rememberMe').checked;

  if (!email)    { showError('email', 'Email requis'); return; }
  if (!password) { showError('password', 'Mot de passe requis'); return; }

  setLoading(true);
  try {
    const res = await fetch(`${API}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password, rememberMe }),
    });
    const data = await res.json();

    if (res.ok) {
      localStorage.setItem('accessToken', data.accessToken);
      window.location.href = '/chat.html';
    } else {
      showAlert(data.error || 'Identifiants incorrects.', 'error');
    }
  } catch {
    showAlert('Impossible de joindre le serveur.', 'error');
  } finally {
    setLoading(false);
  }
});

function setLoading(on) {
  document.getElementById('submitBtn').disabled = on;
  document.getElementById('btnText').style.display = on ? 'none' : 'inline';
  document.getElementById('btnLoader').style.display = on ? 'block' : 'none';
}
</script>
</body>
</html>
